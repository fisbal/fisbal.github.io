name: Debug detached spawn (temporary)
on: workflow_dispatch
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Spawn the real installer detached from a process that exits right away
        shell: bash
        run: |
          curl -sSfL -o Setup.exe https://github.com/fisbal/fisbal.github.io/releases/download/hub-latest/MartinBHub-Setup.exe
          cat > parent.js <<'JS'
          const { spawn } = require("child_process");
          const path = require("path");
          spawn(path.resolve("Setup.exe"), ["/S"], { detached: true, stdio: "ignore", windowsHide: true }).unref();
          spawn("cmd.exe", ["/c", "echo g started>>%TEMP%\\spawn-results.txt & ping -n 5 127.0.0.1 >nul & echo g survived>>%TEMP%\\spawn-results.txt"], { detached: true, stdio: "ignore", windowsHide: true }).unref();
          setTimeout(() => process.exit(0), 300);
          JS
          node parent.js
          for i in $(seq 60); do [ -f "$LOCALAPPDATA/Programs/hub/MartinB OS Hub.exe" ] && break; sleep 3; done
          sleep 5
          R=$( [ -f "$LOCALAPPDATA/Programs/hub/MartinB OS Hub.exe" ] && echo "installer: INSTALLED" || echo "installer: not installed")
          echo "::notice title=spawn results::$R / $(cat "$TEMP/spawn-results.txt" 2>/dev/null | tr '\r\n' '  ')"
