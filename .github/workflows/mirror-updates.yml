name: App update channel

# Copies the newest release of each app (oi1, ProDFos, NavalOS, ...) to this public repo and publishes
# updates/<id>/latest.json + release.json on the hub site, so installed apps keep updating even when
# the app's own repo is private. Runs every 30 minutes, and on demand.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      app:
        description: "Only this app id (empty = all)"
        required: false
        default: ""
      force:
        description: "Copy again even if already copied"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - factory/mirror_updates.py
      - .github/workflows/mirror-updates.yml

permissions:
  contents: write

concurrency:
  group: mirror-updates
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Copy new releases
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: python3 factory/mirror_updates.py ${{ github.event.inputs.app }}
      - name: Publish update files on the site
        if: always()
        run: |
          git add updates
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update channel: new app versions"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
