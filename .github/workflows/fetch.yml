name: Sky Control airport data (OSM, parallel)
on:
  push:
    branches: [osm-data2]
    paths: [fetch.py, .github/workflows/fetch.yml, trigger.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        icao: [KATL, KLAX, KORD, KJFK, KDEN, KMIA, LFPG, EDDF, LEMD, LIRF]
    steps:
      - uses: actions/checkout@v4
        with: { ref: osm-data2 }
      - run: python3 fetch.py ${{ matrix.icao }} || true
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv raw/log.txt raw/log-${{ matrix.icao }}.txt 2>/dev/null || true
          git add raw && git commit -m "Raw OSM ${{ matrix.icao }} [skip ci]" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && exit 0; sleep $((RANDOM % 10 + 3)); done
