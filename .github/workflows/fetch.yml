name: Sky Control airport data (OSM)
on:
  push:
    branches: [osm-data]
    paths: [fetch.py, .github/workflows/fetch.yml, trigger.txt]
permissions:
  contents: write
concurrency: { group: osm-data, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { ref: osm-data }
      - run: python3 fetch.py
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw && git commit -m "Raw OSM airport data [skip ci]" && git pull --rebase && git push || echo nothing
