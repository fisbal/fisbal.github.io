name: MartinB app factory

# Builds an Android APK and a Windows installer for every app in apps.json marked "factory": true,
# each with the gold MartinB window bar, and publishes them as the rolling release "<id>-latest".
# Only apps whose code, logo or settings changed are rebuilt (checked every 6 hours and on every push).

on:
  push:
    branches: [main]
    paths:
      - apps.json
      - factory/**
      - icons/**
      - solitaire/**
      - skycontrol/**
      - skycontrol-hangar/**
      - techfix/**
      - devenir-canadien/**
      - .github/workflows/factory.yml
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      app:
        description: "Only this app id (empty = every app that changed)"
        required: false
        default: ""
      force:
        description: "Rebuild even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      prints: ${{ steps.plan.outputs.prints }}
    steps:
      - uses: actions/checkout@v4
      - name: Find apps to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          ONLY: ${{ github.event.inputs.app || '' }}
        run: python3 factory/build.py plan

  shells:
    # Keeps the web windows (w/<id>/index.html) in step with apps.json.
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate web windows
        run: |
          python3 factory/make_shells.py
          if [ -n "$(git status --porcelain w)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add w && git commit -m "Update web windows [skip ci]" && git push
          fi

  source:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect app files
        run: python3 factory/build.py source ${{ matrix.app }} out
      - uses: actions/upload-artifact@v4
        with:
          name: src-${{ matrix.app }}
          path: out
          include-hidden-files: true
          retention-days: 3

  android:
    needs: [plan, source]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: src-${{ matrix.app }}
          path: src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare Android project
        run: |
          pip install --quiet pillow
          python3 factory/build.py android ${{ matrix.app }} src build-android
      - name: Build signed APK
        working-directory: build-android
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon 2>&1 | tee build.log; then
            # Surface the real reason as an annotation (readable without opening the full log).
            MSG=$(grep -A12 -E "What went wrong|error:" build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Android build (${{ matrix.app }})::$MSG"
            exit 1
          fi
      - name: Name the APK
        run: |
          FILE=$(python3 -c "import json;print(json.load(open('src/meta.json'))['file'])")
          mkdir -p dist && cp build-android/app/build/outputs/apk/release/app-release.apk "dist/$FILE.apk"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}
          path: dist
          retention-days: 3

  windows:
    needs: [plan, source]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: src-${{ matrix.app }}
          path: src
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare Windows project
        run: python factory/build.py electron ${{ matrix.app }} src build-windows
      - name: Build installer
        working-directory: build-windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: bash
        run: |
          set -o pipefail
          npm install --no-audit --no-fund
          if ! npx electron-builder --win nsis --x64 --publish never 2>&1 | tee build.log; then
            MSG=$(grep -iE -B2 -A8 "error|failed" build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Windows build (${{ matrix.app }})::$MSG"
            exit 1
          fi
      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist && cp build-windows/dist/*-Setup.exe dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.app }}
          path: dist
          retention-days: 3

  release:
    needs: [plan, android, windows]
    if: always() && needs.plan.outputs.apps != '[]' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
          pattern: "{apk,exe}-*"
      - name: Publish each app's rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          APPS: ${{ needs.plan.outputs.apps }}
          PRINTS: ${{ needs.plan.outputs.prints }}
        run: |
          python3 - <<'PY'
          import json, os, glob, subprocess, datetime
          apps = {a["id"]: a for a in json.load(open("apps.json"))["apps"]}
          prints = json.loads(os.environ["PRINTS"])
          today = datetime.date.today().isoformat()
          failed = []
          for app_id in json.loads(os.environ["APPS"]):
              a = apps[app_id]
              files = glob.glob(f"art/apk-{app_id}/*.apk") + glob.glob(f"art/exe-{app_id}/*.exe")
              if not files:
                  failed.append(app_id); continue
              complete = len(files) >= 2
              if not complete: failed.append(app_id)
              tag = f"{app_id}-latest"
              notes = (f"**{a['name']}** — {a.get('desc','')}\n\n"
                       f"- **{a['file']}.apk** : Android. Ouvre le fichier depuis l'app *Fichiers* et autorise « installer des applis inconnues » si demandé. Les mises à jour s'installent par-dessus et gardent tes données.\n"
                       f"- **{a['file']}-Setup.exe** : Windows. Si Windows SmartScreen s'affiche : *Informations complémentaires* → *Exécuter quand même*.\n\n"
                       f"Barre MartinB : réduire, plein écran, fermer. Construit le {today}.\n\n"
                       + (f"fingerprint: {prints.get(app_id,'')}\n" if complete else "Build incomplet, nouvel essai au prochain passage.\n"))
              exists = subprocess.run(["gh", "release", "view", tag], capture_output=True).returncode == 0
              if exists:
                  subprocess.run(["gh", "release", "edit", tag, "--title", f"{a['name']} — dernière version", "--notes", notes, "--latest=false"], check=True)
              else:
                  subprocess.run(["gh", "release", "create", tag, "--title", f"{a['name']} — dernière version", "--notes", notes, "--target", "main", "--latest=false"], check=True)
              subprocess.run(["gh", "release", "upload", tag, "--clobber", *files], check=True)
              print("published", tag, [os.path.basename(f) for f in files])
          if failed:
              print("::warning::Incomplete builds:", failed)
          PY
