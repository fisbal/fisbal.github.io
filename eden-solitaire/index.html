<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Eden Solitaire</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#e8c35a;--gold2:#fff1b8;--ink:#0b0718;--n1:#3b1d7a;--n2:#120a2e;--n3:#070414;--acc:#b58cff;--cw:80px}
body[data-ch="1"]{--n1:#12357a;--n2:#081433;--n3:#030816;--acc:#7fc4ff}
body[data-ch="2"]{--n1:#7a1730;--n2:#2c0a18;--n3:#12040a;--acc:#ff8fa3}
body[data-ch="3"]{--n1:#7a5a12;--n2:#2a1c06;--n3:#0d0802;--acc:#ffd76a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--n3);color:#f3ecff;font-family:Cinzel,Georgia,serif}
body{background:radial-gradient(ellipse at 50% 20%,var(--n1),var(--n2) 55%,var(--n3));transition:background 1s}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}#fx{z-index:60}
.screen{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex}
h1.logo{font-family:"Cinzel Decorative",Cinzel,serif;font-size:clamp(34px,8vw,84px);margin:0;letter-spacing:.03em;text-align:center;line-height:1.05;text-shadow:0 0 30px rgba(181,140,255,.7)}
h1.logo b{color:var(--gold);text-shadow:0 0 28px rgba(232,195,90,.8);display:block;font-weight:900}
.sub{color:var(--gold2);letter-spacing:.3em;font-size:clamp(10px,2.2vw,15px);margin-top:14px;text-transform:uppercase;opacity:.85;text-align:center}
.btn{font-family:Cinzel,serif;font-weight:700;font-size:16px;color:#1a1030;background:linear-gradient(180deg,#fff1b8,#e8c35a 55%,#b88a2a);border:0;border-radius:999px;padding:13px 30px;cursor:pointer;box-shadow:0 0 0 1px #fff6d0 inset,0 6px 22px rgba(232,195,90,.35);transition:transform .15s,filter .15s;letter-spacing:.06em}
.btn:hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.06);color:#f3ecff;box-shadow:0 0 0 1px rgba(232,195,90,.5) inset}
.btn.sm{padding:8px 16px;font-size:13px}
#splash,#menu{justify-content:center;gap:10px;padding:20px}
#splash .tap{margin-top:46px;color:var(--gold2);animation:pulse 1.6s infinite;letter-spacing:.2em;font-size:14px}
@keyframes pulse{50%{opacity:.25}}
.orb{width:120px;height:120px;border-radius:50%;margin-bottom:18px;background:radial-gradient(circle at 35% 30%,#fff,#e8c35a 30%,#7a3bd6 70%,transparent 72%);box-shadow:0 0 60px #b58cff,0 0 120px rgba(232,195,90,.5);animation:float 4s ease-in-out infinite;display:grid;place-items:center;font-size:54px;color:#1a1030}
@keyframes float{50%{transform:translateY(-12px) rotate(4deg)}}
#menu .col{display:flex;flex-direction:column;gap:12px;margin-top:34px;width:min(320px,86vw)}
#map{padding:16px;overflow:auto}
#map h2{font-family:"Cinzel Decorative",serif;color:var(--gold);margin:8px 0 14px}
.chap{width:min(760px,100%);background:rgba(10,6,26,.55);border:1px solid rgba(232,195,90,.35);border-radius:16px;padding:12px 14px;margin-bottom:12px;backdrop-filter:blur(4px)}
.chap h3{margin:0 0 10px;font-size:15px;color:var(--gold2);letter-spacing:.08em}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lv{border-radius:12px;padding:10px 8px;text-align:center;background:linear-gradient(160deg,rgba(181,140,255,.25),rgba(20,10,50,.7));border:1px solid rgba(181,140,255,.5);cursor:pointer;transition:transform .15s;font-size:12px;min-height:74px}
.lv:hover{transform:translateY(-3px);border-color:var(--gold)}
.lv.lock{opacity:.4;cursor:default;filter:grayscale(1)}.lv.lock:hover{transform:none}
.lv .n{font-size:20px;color:var(--gold);font-weight:700}.lv .st{color:var(--gold);letter-spacing:2px;font-size:14px;height:18px}
#game{align-items:stretch}
#top{height:52px;display:flex;align-items:center;gap:10px;padding:0 10px;background:linear-gradient(180deg,rgba(5,3,14,.85),rgba(5,3,14,.3));font-size:13px;z-index:3}
#top .ttl{flex:1;min-width:0}#top .ttl div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvname{color:var(--gold);font-weight:700}
#goalbar{height:5px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:4px;overflow:hidden}
#goalfill{height:100%;width:0;background:linear-gradient(90deg,#b58cff,#e8c35a);transition:width .4s;box-shadow:0 0 8px #e8c35a}
.stat{text-align:center;min-width:52px}.stat small{display:block;font-size:9px;opacity:.6;letter-spacing:.1em}.stat b{font-size:15px;color:var(--gold2)}
.stat.warn b{color:#ff6b6b;animation:pulse .8s infinite}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid rgba(232,195,90,.6);background:rgba(255,255,255,.06);color:var(--gold);font-size:18px;cursor:pointer;display:grid;place-items:center;flex:none}
#board{flex:1;position:relative;touch-action:none;overflow:hidden}
#bot{min-height:66px;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(5,3,14,.9),rgba(5,3,14,.3));z-index:3;flex-wrap:wrap}
.tb{font-family:Cinzel,serif;font-weight:700;color:#f3ecff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:6px 10px;font-size:11px;cursor:pointer;min-width:62px;text-align:center;line-height:1.25;transition:transform .12s,box-shadow .2s}
.tb span{display:block;font-size:19px}.tb:active{transform:scale(.94)}
.tb.sp{border-color:var(--acc);background:linear-gradient(180deg,rgba(181,140,255,.3),rgba(40,20,90,.5))}
.tb.sp.ready{box-shadow:0 0 14px var(--acc);animation:glow 2s infinite}
.tb.sp.off{opacity:.38}
@keyframes glow{50%{box-shadow:0 0 24px var(--gold)}}
#mana{font-weight:700;color:var(--gold2);font-size:15px;padding:0 6px;text-align:center;min-width:54px;text-shadow:0 0 10px var(--gold)}#mana small{display:block;font-size:9px;opacity:.7;letter-spacing:.12em}
.slot{position:absolute;width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.09);border:1.5px dashed rgba(232,195,90,.35);display:grid;place-items:center;font-size:calc(var(--cw)*.5);color:rgba(232,195,90,.35)}
.slot.f{border-style:solid;background:radial-gradient(circle,rgba(181,140,255,.22),transparent 70%);animation:rune 5s linear infinite}
@keyframes rune{50%{box-shadow:0 0 18px rgba(181,140,255,.55);border-color:rgba(232,195,90,.8)}}
.slot.hint,.card.hint .f{box-shadow:0 0 0 3px var(--gold),0 0 26px 6px var(--gold)!important}
.card{position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw)*1.4);font-size:calc(var(--cw)*.25);transition:transform .32s cubic-bezier(.2,.85,.25,1.05);perspective:600px;cursor:pointer;will-change:transform}
.card.drag{transition:none;filter:drop-shadow(0 14px 14px rgba(0,0,0,.6))}
.card.nt{transition:none}
.in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .38s}
.card.down .in{transform:rotateY(180deg)}
.peek .card.down .in{transform:rotateY(0)}
.peek .card.down .f{background:linear-gradient(160deg,#e9dcff,#b99cff);box-shadow:0 0 16px #b58cff}
.f,.b{position:absolute;inset:0;border-radius:calc(var(--cw)*.09);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 2px 5px rgba(0,0,0,.5)}
.f{background:linear-gradient(160deg,#fffdf6,#efe6d2);color:#17102b;font-family:Georgia,serif;overflow:hidden}
.f.red{color:#c2183c}
#board .card.gold .in .f{background:linear-gradient(135deg,#fff6c9,#e8c35a 45%,#fff1b8 60%,#b88a2a);color:#3a2500;box-shadow:0 0 18px var(--gold)}
.c{position:absolute;left:.22em;top:.12em;font-weight:700;line-height:1;white-space:nowrap}.c i{font-style:normal;font-size:.9em;margin-left:.05em}
.c.br{left:auto;top:auto;right:.22em;bottom:.12em;transform:rotate(180deg)}
.mid{position:absolute;inset:0;display:grid;place-items:center;font-size:2.3em;padding-top:.15em}
.mid.fig{inset:22% 16% 20%;border:1.5px solid currentColor;border-radius:.3em;font-size:1em;padding:0;background:linear-gradient(180deg,rgba(232,195,90,.25),rgba(181,140,255,.2));display:flex;flex-direction:column;justify-content:center;align-items:center}
.mid.fig b{font-family:"Cinzel Decorative",serif;font-size:1.9em;line-height:1}.mid.fig i{font-style:normal;font-size:1.1em;line-height:1}
.b{transform:rotateY(180deg);background:radial-gradient(circle at 50% 50%,#e8c35a 0 7%,transparent 8%),radial-gradient(circle at 50% 50%,transparent 0 17%,rgba(232,195,90,.7) 18% 20%,transparent 21%),repeating-linear-gradient(45deg,rgba(232,195,90,.16) 0 2px,transparent 2px 9px),repeating-linear-gradient(-45deg,rgba(181,140,255,.2) 0 2px,transparent 2px 9px),linear-gradient(160deg,var(--n1),var(--n3));border:calc(var(--cw)*.035) solid #e8c35a}
.shake .in{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:70;background:rgba(10,6,26,.9);border:1px solid var(--gold);border-radius:999px;padding:8px 18px;font-size:13px;color:var(--gold2);opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;z-index:80;background:rgba(3,2,10,.72);display:none;place-items:center;padding:16px;backdrop-filter:blur(3px)}
#modal.on{display:grid}
.box{width:min(460px,100%);max-height:92vh;overflow:auto;background:linear-gradient(170deg,#2a1560,#0d0722);border:1px solid var(--gold);border-radius:20px;padding:22px;text-align:center;box-shadow:0 0 60px rgba(181,140,255,.45);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.box h2{font-family:"Cinzel Decorative",serif;color:var(--gold);margin:0 0 10px;font-size:24px}
.box p{font-family:Georgia,serif;line-height:1.5;font-size:15px;margin:8px 0}
.box .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.stars{font-size:46px;letter-spacing:8px;color:#4a3a78;margin:6px 0}.stars i{font-style:normal;display:inline-block;transition:all .4s cubic-bezier(.2,1.8,.4,1)}.stars i.on{color:var(--gold);text-shadow:0 0 22px var(--gold);transform:scale(1.25) rotate(-8deg)}
.clue{background:rgba(232,195,90,.1);border:1px dashed var(--gold);border-radius:12px;padding:10px 12px;margin-top:12px;text-align:left}.clue small{color:var(--gold);letter-spacing:.15em;font-size:10px;display:block;margin-bottom:4px}
label.sl{display:block;text-align:left;font-size:13px;margin:12px 0 4px;color:var(--gold2)}
input[type=range],select{width:100%;accent-color:#e8c35a}select{background:#150a35;color:#fff;border:1px solid var(--gold);border-radius:8px;padding:8px;font-family:Cinzel,serif}
#dlg{position:fixed;inset:0;z-index:75;display:none;align-items:flex-end;justify-content:center;background:linear-gradient(0deg,rgba(3,2,10,.9),rgba(3,2,10,.35));padding:14px;cursor:pointer}
#dlg.on{display:flex}
#dlg .d{width:min(720px,100%);background:linear-gradient(170deg,#2a1560,#0d0722);border:1px solid var(--gold);border-radius:18px;padding:16px 18px 14px;display:flex;gap:14px;box-shadow:0 0 50px rgba(181,140,255,.4);margin-bottom:4vh;animation:pop .3s}
#dport{flex:none;width:64px;height:88px;border-radius:8px;background:linear-gradient(160deg,#fffdf6,#e8d9b0);color:#17102b;display:grid;place-items:center;font-family:"Cinzel Decorative",serif;font-size:26px;font-weight:900;box-shadow:0 0 18px var(--acc);line-height:1}
#dport.red{color:#c2183c}#dport.nar{background:radial-gradient(circle,#e8c35a,#7a3bd6);color:#fff}
#dname{color:var(--gold);font-weight:700;font-size:14px;letter-spacing:.1em;min-height:18px}
#dtext{font-family:Georgia,serif;font-size:16px;line-height:1.5;min-height:74px;margin-top:4px}
#dnext{font-size:11px;opacity:.6;text-align:right;letter-spacing:.15em}
@media(max-width:520px){.stat.hm{display:none}.tb{min-width:0;padding:5px 5px;font-size:9px;flex:1 1 0;white-space:nowrap}.tb span{font-size:17px}#bot{gap:4px;flex-wrap:nowrap}#mana{min-width:42px;padding:0 2px;font-size:13px}}
h1.logo b{background:linear-gradient(90deg,#b88a2a,#fff1b8,#e8c35a,#ffffff,#e8c35a,#b88a2a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px rgba(232,195,90,.6));animation:shim 6s linear infinite}
@keyframes shim{to{background-position:300% 0}}
.ft{position:fixed;z-index:65;pointer-events:none;font-weight:700;color:var(--gold2);text-shadow:0 0 10px var(--gold),0 2px 4px #000;animation:ftUp 1.1s ease-out forwards;transform:translate(-50%,-50%);font-size:18px;white-space:nowrap}
.ft.big{font-family:"Cinzel Decorative",serif;font-size:clamp(26px,6vw,44px);color:#fff}
@keyframes ftUp{0%{opacity:0;margin-top:10px;scale:.5}20%{opacity:1;scale:1.2}100%{opacity:0;margin-top:-70px;scale:1}}
#flash{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0;background:#fff}
#flash.on{animation:fl .7s ease-out}
@keyframes fl{0%{opacity:.8}100%{opacity:0}}
.quake{animation:quake .35s}
@keyframes quake{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
.vico{font-size:64px;line-height:1.1;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 18px var(--gold))}
.verse{text-align:left;border-bottom:1px solid rgba(232,195,90,.25);padding:8px 0;display:flex;gap:10px;font-family:Georgia,serif;font-size:14px;line-height:1.4}.verse .i{font-size:26px;flex:none;width:36px;text-align:center}.verse small{color:var(--gold);display:block;font-family:Cinzel,serif;letter-spacing:.06em}
#starTot{color:var(--gold2);margin-top:12px;font-size:14px;letter-spacing:.12em}
/* styles de cartes : un par niveau (classe cdN sur le plateau) */
.mid u{text-decoration:none}.mr{display:none;line-height:.9;text-align:center}.mr i{display:block;font-style:normal;font-size:.5em;line-height:1.1}
.cd1 .in .f{background:radial-gradient(ellipse at 50% 40%,#f8ecc8,#e3c98e 85%,#b9954f);color:#3b2a14;box-shadow:inset 0 0 0 .08em #8a6a2e,0 2px 5px rgba(0,0,0,.5)}
.cd1 .in .f.red{color:#9c1f1f}
.cd1 .b{background:repeating-linear-gradient(90deg,rgba(0,0,0,.2) 0 2px,transparent 2px 7px),radial-gradient(circle,#d9b566 0 8%,transparent 9%),linear-gradient(160deg,#8a5a2a,#3a2410);border-color:#d9b566}
.cd1 .ms,.cd3 .ms{display:none}.cd1 .mr,.cd3 .mr{display:block}
.cd1 .mr{font-family:"Cinzel Decorative",Cinzel,serif;font-weight:900}
.cd2 .in .f{background:linear-gradient(160deg,#1c2350,#0a0d26);color:#e9ecff;box-shadow:inset 0 0 0 .07em var(--gold),0 2px 5px rgba(0,0,0,.6)}
.cd2 .in .f.red{color:#ff7f9c}
.cd2 .mid{text-shadow:0 0 .3em currentColor}
.cd2 .mid.fig{background:rgba(255,255,255,.08)}
.cd2 .b{background:radial-gradient(circle at 20% 25%,#fff 0 3%,transparent 4%),radial-gradient(circle at 70% 15%,#ffe9a8 0 2.5%,transparent 3.5%),radial-gradient(circle at 80% 60%,#fff 0 3%,transparent 4%),radial-gradient(circle at 35% 75%,#ffe9a8 0 3%,transparent 4%),radial-gradient(circle at 55% 45%,#fff 0 2%,transparent 3%),linear-gradient(160deg,var(--n1),#05061a)}
.cd3 .in .f{background:linear-gradient(135deg,#f2f2ee,#cfd2d6 50%,#eceae4);color:#2a2f38;border-radius:calc(var(--cw)*.04);text-shadow:0 1px 0 #fff}
.cd3 .in .f.red{color:#a02c2c}
.cd3 .mr{font-family:Cinzel,serif;font-weight:700}
.cd3 .b{border-radius:calc(var(--cw)*.04);background:repeating-radial-gradient(circle at 50% 50%,rgba(232,195,90,.4) 0 2px,transparent 2px 10px),linear-gradient(160deg,var(--n1),var(--n3))}
.cd4 .in .f{background:#fffef8;color:#1a2a6e;box-shadow:inset 0 0 0 .13em var(--acc),inset 0 0 0 .19em #1a1030,0 2px 5px rgba(0,0,0,.5)}
.cd4 .in .f.red{color:#c2183c}
.cd4 .c{left:.36em;top:.28em}.cd4 .c.br{left:auto;top:auto;right:.36em;bottom:.28em}
.cd4 .b{background:radial-gradient(circle,#fff1b8 0 10%,transparent 11%),repeating-conic-gradient(from 45deg,var(--acc) 0 25%,var(--n1) 0 50%) 0 0/25% 18%;border-color:#fff1b8}
.cd5 .in .f{background:linear-gradient(160deg,#fffaf0,#f4e3b5);color:#3a2500;box-shadow:inset 0 0 0 .06em #b88a2a,inset 0 0 0 .14em #fffaf0,inset 0 0 0 .19em #b88a2a,0 2px 5px rgba(0,0,0,.5)}
.cd5 .in .f.red{color:#b01030}
.cd5 .c{left:.38em;top:.3em}.cd5 .c.br{left:auto;top:auto;right:.38em;bottom:.3em}
.cd5 .b{background:radial-gradient(circle,#fff1b8 0 9%,transparent 10%),repeating-conic-gradient(from 0deg,rgba(232,195,90,.6) 0 5deg,transparent 5deg 15deg),linear-gradient(160deg,var(--n1),var(--n3))}
.cd4 .mid.fig,.cd5 .mid.fig{inset:25% 20%}
.mid.fig{inset:21.5% 16%;padding:0;overflow:hidden;border:.06em solid currentColor;border-radius:.22em;display:block;background:none;font-size:1em}
.mid.fig img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block;pointer-events:none}
.b{overflow:hidden}.b::before{content:"";position:absolute;inset:0;background:var(--back) center/cover no-repeat;filter:hue-rotate(var(--hue,0deg))}
.tb em{font-style:normal}
</style>
</head>
<body data-ch="0">
<canvas id="bg"></canvas>

<div id="splash" class="screen on">
  <div class="orb">♠</div>
  <h1 class="logo">Eden<b>Solitaire</b></h1>
  <div class="sub" data-t="sub"></div>
  <div class="tap" data-t="tap"></div>
</div>

<div id="menu" class="screen">
  <h1 class="logo">Eden<b>Solitaire</b></h1>
  <div class="sub" data-t="sub"></div>
  <div id="starTot"></div>
  <div class="col">
    <button class="btn" id="bCont" data-t="cont"></button>
    <button class="btn ghost" id="bMap" data-t="map"></button>
    <button class="btn ghost" id="bBook" data-t="book"></button>
    <button class="btn ghost" id="bFree" data-t="free"></button>
    <button class="btn ghost" id="bVoice">🗣 <span data-t="voice"></span></button>
    <button class="btn ghost" id="bOpt" data-t="opt"></button>
    <button class="btn ghost sm" id="bLang">🌐 <span data-t="lang"></span></button>
  </div>
</div>

<div id="map" class="screen">
  <h2 data-t="maph"></h2>
  <div id="chaps" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
  <button class="btn ghost sm" id="bBack">⌂ <span data-t="back"></span></button>
</div>

<div id="game" class="screen">
  <div id="top">
    <button class="ib" id="bHome" aria-label="Menu">⌂</button>
    <button class="ib" id="bPause">☰</button>
    <div class="ttl"><div id="lvname"></div><div id="goaltxt" style="font-size:11px;opacity:.8"></div><div id="goalbar"><div id="goalfill"></div></div></div>
    <div class="stat hm"><small data-t="pass"></small><b id="sPass">∞</b></div>
    <div class="stat hm"><small data-t="moves"></small><b id="sMoves">0</b></div>
    <div class="stat" id="tBox"><small data-t="time"></small><b id="sTime">0:00</b></div>
    <div class="stat"><small>SCORE</small><b id="sScore">0</b></div>
  </div>
  <div id="board"></div>
  <div id="bot">
    <button class="tb" id="bUndo"><span>↶</span><em data-t="undo"></em></button>
    <button class="tb" id="bHint"><span>✧</span><em data-t="hint"></em></button>
    <div id="mana"><small data-t="manna"></small>✦ <span id="manaN">0</span></div>
    <button class="tb sp" data-sp="vision"><span>◉</span><em data-t="vision"></em></button>
    <button class="tb sp" data-sp="vortex"><span>🌀</span><em data-t="vortex"></em></button>
    <button class="tb sp" data-sp="wand"><span>⚡</span><em data-t="staff"></em></button>

function startLevel(i){const l=LV[i];G.idx=i;G.lv=l;G.ch=l.ch;G.draw=l.draw;G.pl=l.pass||0;G.tl=l.time||0;G.goal=l.goal;$('#lvname').textContent=`${i+1} · ${lt(l).name}`;show('game');newGame();dialog(lt(l).intro,()=>{if(i===0){flash('#fff');S.spell()}dealAnim()})}

  layout();const p=spos(a[a.length-1]);say(L('Tourbillon d’Élie.','Elijah’s whirlwind.'),1);for(let i=0;i<5;i++)setTimeout(()=>{ring(p.x,p.y,COL[i]);burst(p.x,p.y,12,5,0)},i*90);toast(L('🌀 Tourbillon d’Élie — la pioche est remélangée','🌀 Elijah’s Whirlwind — the stock is reshuffled'))}
 else{let best=null,bs=-1;for(let s=0;s<4;s++){const n=st.found[s].length;if(n>=13)continue;const id=s*13+n,L=locate(id);let sc=L.p==='t'?(st.up[id]?(L.k===st.tab[L.i].length-1?0:2):3+L.k):(L.p==='w'&&L.k===st.waste.length-1?0:1);if(sc>bs){bs=sc;best={id,L}}}
  if(!best)return;snap();G.mana-=8;S.spell();const{id,L:Q}=best,from=spos(id);const src=Q.p==='s'?st.stock:Q.p==='w'?st.waste:st.tab[Q.i];src.splice(Q.k,1);st.up[id]=true;st.found[suit(id)].push(id);
