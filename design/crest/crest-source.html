<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#333;display:flex;flex-wrap:wrap;gap:8px}svg{display:block}</style></head><body>
<script>
// MartinB crest family: one gold bezel for every app, a distinct gold emblem and a coloured glow inside.
const DEFS = `
<defs>
 <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="150" y1="110" x2="330" y2="410">
  <stop offset="0" stop-color="#fff4c2"/><stop offset=".22" stop-color="#f1c75a"/><stop offset=".48" stop-color="#b9842a"/>
  <stop offset=".62" stop-color="#f6d77c"/><stop offset=".82" stop-color="#c8922f"/><stop offset="1" stop-color="#7a5212"/>
 </linearGradient>
 <linearGradient id="goldRing" gradientUnits="userSpaceOnUse" x1="40" y1="40" x2="472" y2="472">
  <stop offset="0" stop-color="#fff0b5"/><stop offset=".3" stop-color="#d9a640"/><stop offset=".55" stop-color="#8a5f17"/>
  <stop offset=".75" stop-color="#f3d27a"/><stop offset="1" stop-color="#9c6d1e"/>
 </linearGradient>
 <radialGradient id="bgv" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#1a1712"/><stop offset="1" stop-color="#050504"/></radialGradient>
 <filter id="bevel" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/>
  <feSpecularLighting in="b" surfaceScale="5" specularConstant="1.1" specularExponent="22" lighting-color="#fff6d8" result="s">
   <feDistantLight azimuth="235" elevation="48"/></feSpecularLighting>
  <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
  <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".75" k4="0" result="lit"/>
  <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".75"/>
 </filter>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>`;

function frame(glow){
 const studs=[[256,40],[472,256],[256,472],[40,256]].map(([x,y])=>`<path d="M${x} ${y-14}L${x+11} ${y}L${x} ${y+14}L${x-11} ${y}Z" fill="url(#goldRing)" filter="url(#bevel)"/>`).join('');
 return `<rect width="512" height="512" fill="url(#bgv)"/>
 <circle cx="256" cy="256" r="150" fill="${glow}" opacity=".32" filter="url(#soft)"/>
 <circle cx="256" cy="256" r="186" fill="#0b0a08"/>
 <circle cx="256" cy="256" r="196" fill="none" stroke="url(#goldRing)" stroke-width="16" filter="url(#bevel)"/>
 <circle cx="256" cy="256" r="176" fill="none" stroke="url(#goldRing)" stroke-width="3.5" opacity=".9"/>
 <circle cx="256" cy="256" r="172" fill="${glow}" opacity=".10"/>
 ${studs}`;
}
const G = 'fill="url(#gold)" filter="url(#bevel)"';
const GS = w => `fill="none" stroke="url(#gold)" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" filter="url(#bevel)"`;

const ICONS = {
 navalos: ['#2d6bd6', `<g ${GS(16)}><circle cx="256" cy="150" r="20"/><path d="M256 170v196"/><path d="M196 214h120"/><path d="M150 296c10 52 54 82 106 82s96-30 106-82"/></g>
   <path d="M150 296l-22 18 34 8z M362 296l22 18-34 8z" ${G}/>`],
 millionos: ['#c0262d', `<path d="M256 150l28 58 64 9-46 44 11 63-57-30-57 30 11-63-46-44 64-9z" ${G}/>
   <g fill="url(#gold)" filter="url(#bevel)"><ellipse cx="218.9" cy="370.1" rx="8" ry="19" transform="rotate(88.0 218.9 370.1)"/><ellipse cx="182.1" cy="350.6" rx="8" ry="19" transform="rotate(108.0 182.1 350.6)"/><ellipse cx="154.2" cy="319.6" rx="8" ry="19" transform="rotate(128.0 154.2 319.6)"/><ellipse cx="138.6" cy="280.9" rx="8" ry="19" transform="rotate(148.0 138.6 280.9)"/><ellipse cx="137.2" cy="239.3" rx="8" ry="19" transform="rotate(168.0 137.2 239.3)"/><ellipse cx="150.0" cy="199.7" rx="8" ry="19" transform="rotate(188.0 150.0 199.7)"/><ellipse cx="175.7" cy="166.8" rx="8" ry="19" transform="rotate(208.0 175.7 166.8)"/><ellipse cx="293.1" cy="370.1" rx="8" ry="19" transform="rotate(92.0 293.1 370.1)"/><ellipse cx="329.9" cy="350.6" rx="8" ry="19" transform="rotate(72.0 329.9 350.6)"/><ellipse cx="357.8" cy="319.6" rx="8" ry="19" transform="rotate(52.0 357.8 319.6)"/><ellipse cx="373.4" cy="280.9" rx="8" ry="19" transform="rotate(32.0 373.4 280.9)"/><ellipse cx="374.8" cy="239.3" rx="8" ry="19" transform="rotate(12.0 374.8 239.3)"/><ellipse cx="362.0" cy="199.7" rx="8" ry="19" transform="rotate(-8.0 362.0 199.7)"/><ellipse cx="336.3" cy="166.8" rx="8" ry="19" transform="rotate(-28.0 336.3 166.8)"/></g>`],
 marbleos: ['#d02828', `<g ${G}>${Array.from({length:16},(_,i)=>{const a=i*Math.PI/8;const r1=i%2?78:72,r2=i%2?116:140;const w=i%2?.07:.1;return `<path d="M${256+r1*Math.cos(a-w)} ${256+r1*Math.sin(a-w)}L${256+r2*Math.cos(a)} ${256+r2*Math.sin(a)}L${256+r1*Math.cos(a+w)} ${256+r1*Math.sin(a+w)}Z"/>`}).join('')}</g>
   <circle cx="256" cy="256" r="74" fill="none" stroke="url(#gold)" stroke-width="10" filter="url(#bevel)"/>
   <radialGradient id="ruby" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#ffd0d0"/><stop offset=".18" stop-color="#ff4a4a"/><stop offset=".6" stop-color="#b10f1a"/><stop offset="1" stop-color="#3a0006"/></radialGradient>
   <circle cx="256" cy="256" r="58" fill="url(#ruby)"/><ellipse cx="236" cy="230" rx="18" ry="11" fill="#fff" opacity=".55"/>`],
 solitaire: ['#c89a3a', `<radialGradient id="pearl" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".2" stop-color="#f5df9e"/><stop offset=".6" stop-color="#c8922f"/><stop offset="1" stop-color="#5a3c0c"/></radialGradient>
   ${[[0,-1],[0,-2],[0,1],[0,2],[-1,0],[-2,0],[1,0],[2,0]].map(([x,y])=>`<circle cx="${256+x*52}" cy="${256+y*52}" r="21" fill="url(#pearl)" filter="url(#bevel)"/>`).join('')}
   <circle cx="256" cy="256" r="14" fill="#000" stroke="url(#gold)" stroke-width="3"/>`],
 skycontrol: ['#1fa7d6', `<g ${GS(5)} opacity=".75"><circle cx="256" cy="256" r="128"/><circle cx="256" cy="256" r="84"/></g>
   <path d="M256 256L256 128A128 128 0 0 1 367 192Z" fill="#1fa7d6" opacity=".25"/>
   <g transform="translate(256 262) rotate(40)"><path d="M0-110c8 0 13 9 13 22v54l72 42v19l-72-20v46l22 17v14l-35-9-35 9v-14l22-17v-46l-72 20v-19l72-42v-54c0-13 5-22 13-22z" ${G}/></g>`],
 'skycontrol-hangar': ['#8aa2b8', `<path d="M136 338V250Q256 128 376 250V338H350V262Q256 168 162 262V338Z" ${G}/>
   <g transform="translate(252 316) scale(1.05)"><path d="M-92 4h140l38-20h13l-11 28h-12l-6 10h-162l-10-8z" ${G}/></g>
   <rect x="124" y="340" width="264" height="12" rx="4" ${G}/>`],
 techfix: ['#2bb673', `<path d="M256 120l104 44v80c0 64-44 112-104 136-60-24-104-72-104-136v-80z" ${GS(14)}/>
   <path d="M180 262h36l18-44 26 92 20-48h52" ${GS(13)}/>`],
 'devenir-canadien': ['#d4202f', `<path d="M256 118l20 40 26-12-10 62 34-36 8 20 38-8-12 42 18 8-62 52 8 24-60-10v60h-16v-60l-60 10 8-24-62-52 18-8-12-42 38 8 8-20 34 36-10-62 26 12z" ${G}/>`],
 oi1: ['#6a4fd6', `<g ${G}><rect x="166" y="166" width="78" height="78" rx="12"/><rect x="268" y="166" width="78" height="78" rx="12"/><rect x="166" y="268" width="78" height="78" rx="12"/></g>
   <path d="M290 290l26-18v76" ${GS(14)}/>`],
 holochrono: ['#26d3e8', `<circle cx="256" cy="256" r="118" ${GS(10)}/>${Array.from({length:12},(_,i)=>{const a=i*Math.PI/6,r1=i%3?100:92;return `<path d="M${256+r1*Math.cos(a)} ${256+r1*Math.sin(a)}L${256+108*Math.cos(a)} ${256+108*Math.sin(a)}" ${GS(i%3?5:9)}/>`}).join('')}
   <path d="M256 256V168M256 256l62 36" ${GS(12)}/><circle cx="256" cy="256" r="12" ${G}/>`],
 sharetvos: ['#e07a2a', `<rect x="140" y="160" width="232" height="160" rx="22" ${GS(14)}/>
   <path d="M232 204l66 36-66 36z" ${G}/><path d="M206 360h100" ${GS(14)}/>`],
 hub: ['#c9a227', `<text x="256" y="300" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="150" ${G}>OS</text>`],
 prodfos: ['#8a4fe0', `<path d="M180 128h112l52 52v204H180z" ${GS(12)}/><path d="M292 128v52h52" ${GS(10)}/>
   <text x="256" y="320" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="120" ${G}>P</text>`],
 'true-north-command': ['#2b5fa8', `<path d="M256 112l26 118 118 26-118 26-26 118-26-118-118-26 118-26z" ${G}/>
   <path d="M256 112l26 118-26 26-26-26z" fill="#d52b1e"/><circle cx="256" cy="256" r="12" fill="#0b0a08" stroke="url(#gold)" stroke-width="3"/>`],
 downloados: ['#2bb673', `<path d="M256 136v136M196 214l60 60 60-60" ${GS(18)}/><path d="M166 300v40h180v-40" ${GS(14)}/>`]
};
for (const [id,[glow,body]] of Object.entries(ICONS)){
 document.body.insertAdjacentHTML('beforeend',`<svg id="${id}" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">${DEFS}${frame(glow)}${body}</svg>`);
}
</script></body></html>
