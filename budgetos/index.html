<!doctype html>
<html lang="fr" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BudgetOS</title>
<meta name="description" content="Tes comptes paie par paie, au style Office In 1.">
<meta name="theme-color" content="#F4F1E8">
<link rel="icon" href="../icons/budgetos.png">
<link rel="apple-touch-icon" href="../icons/budgetos.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Office In 1 shell — brand bar + ribbon tabs on desktop, bottom dock on phone; content is one column of panels */
:root{
  --bg:#F4F1E8; --surface:#FFFDF8; --sunk:#ECE8DC; --ink:#22261E; --muted:#6C6F63; --line:#E2DDCE;
  --green:#1E6A44; --green-soft:#DDEBDF; --gold:#B8913A; --gold-soft:#F3E8C8; --gold-hi:#E2C676;
  --blue:#2F68C8; --blue-soft:#DCE7F8; --orange:#D98522; --orange-soft:#F8E6CC;
  --red:#B8402B; --red-soft:#F6DED8; --pos:#1E7A4C;
  --shadow:0 1px 2px rgba(60,50,20,.06),0 6px 18px rgba(60,50,20,.06);
  --f-brand:"DM Serif Display",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13150F; --surface:#1C1F18; --sunk:#252920; --ink:#EDEADF; --muted:#9EA192; --line:#30352A;
  --green:#5BBE88; --green-soft:#1F3428; --gold:#D8B661; --gold-soft:#3A3220; --gold-hi:#E9CD7E;
  --blue:#7FA8F0; --blue-soft:#1E2A40; --orange:#F0A84E; --orange-soft:#3A2A16;
  --red:#F08470; --red-soft:#3D221D; --pos:#66C995; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13150F; --surface:#1C1F18; --sunk:#252920; --ink:#EDEADF; --muted:#9EA192; --line:#30352A;
  --green:#5BBE88; --green-soft:#1F3428; --gold:#D8B661; --gold-soft:#3A3220; --gold-hi:#E9CD7E;
  --blue:#7FA8F0; --blue-soft:#1E2A40; --orange:#F0A84E; --orange-soft:#3A2A16;
  --red:#F08470; --red-soft:#3D221D; --pos:#66C995; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* brand bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,var(--gold-hi),var(--gold) 70%);color:#2A2210;font-family:var(--f-brand);font-size:22px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.brand{font-family:var(--f-brand);font-size:22px;letter-spacing:.2px;white-space:nowrap}
.brand small{color:var(--gold);font-size:14px;margin-left:1px}
.doc-pill{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border:1.5px solid var(--green);border-radius:14px;background:var(--surface);min-width:0}
.doc-pill i{width:24px;height:24px;border-radius:7px;background:var(--green);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;flex:none}
.doc-pill span{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok b{background:var(--pos)} .sync.busy b{background:var(--gold)} .sync.err b{background:var(--red)}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8}
.ribbon{display:flex;gap:4px;padding-bottom:8px;overflow-x:auto;scrollbar-width:none}
.ribbon button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;color:var(--muted);white-space:nowrap}
.ribbon button[aria-selected="true"]{background:var(--gold-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold)}
.ribbon .gold{color:var(--gold)}

main{padding-block:20px 120px;display:grid;gap:18px}
.view{display:grid;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel h2{font-family:var(--f-brand);font-weight:400;font-size:21px;margin:0 0 4px;text-wrap:balance}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}

/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.kpi.main{background:linear-gradient(160deg,var(--surface),var(--gold-soft));border-color:var(--gold)}
.kpi .v{font-family:var(--f-brand);font-size:34px;line-height:1.1;margin-top:6px}
.kpi.main .v{font-size:42px}
.kpi .d{font-size:13px;color:var(--muted);margin-top:4px}
.neg{color:var(--red)} .posc{color:var(--pos)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.chip.r{background:var(--red-soft);color:var(--red)} .chip.g{background:var(--green-soft);color:var(--pos)} .chip.y{background:var(--gold-soft);color:var(--gold)}

.two{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.chartbox{width:100%;overflow:hidden}
.chartbox svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}

/* lists */
.items{display:grid;gap:2px}
.item{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:8px 6px;border-radius:10px}
.item:hover{background:var(--sunk)}
.item .nm{min-width:0}
.item .nm div{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nm small{color:var(--muted);font-size:12px}
.item .amt{font-weight:700}
.item.done .nm div,.item.done .amt{text-decoration:line-through;color:var(--muted)}
.chk{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.chk svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.chk[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.chk[aria-pressed="true"] svg{opacity:1}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--c)}
.sumrow{display:flex;justify-content:space-between;padding:10px 6px 0;margin-top:6px;border-top:1px dashed var(--line);font-weight:700}

.insights{display:grid;gap:10px}
.ins{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px;border-radius:12px;background:var(--sunk)}
.ins .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-family:var(--f-brand);font-size:18px}
.ins.r .ic{background:var(--red-soft);color:var(--red)} .ins.y .ic{background:var(--gold-soft);color:var(--gold)} .ins.g .ic{background:var(--green-soft);color:var(--pos)} .ins.b .ic{background:var(--blue-soft);color:var(--blue)}
.ins b{display:block;margin-bottom:2px}
.ins p{margin:0;font-size:13.5px;color:var(--muted)}

/* periods */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.pcard.now{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft),var(--shadow)}
.phead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.phead .date{font-family:var(--f-brand);font-size:22px}
.phead .bal{margin-left:auto;text-align:right}
.phead .bal div{font-weight:800;font-size:17px}
.phead .bal small{font-size:11.5px;color:var(--muted)}
.pbody{padding:8px 10px 14px}
.grp{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 6px 4px}
.amtbtn{border:0;background:none;font-weight:700;padding:4px 6px;border-radius:7px}
.amtbtn:hover{background:var(--gold-soft)}
.amtin{width:90px;text-align:right;border:1.5px solid var(--gold);border-radius:8px;padding:4px 8px;background:var(--surface)}
.bars{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex;margin:0 16px 0}

/* grid view */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.sheet{border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:100%}
.sheet th,.sheet td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;white-space:nowrap}
.sheet thead th{position:sticky;top:0;background:var(--sunk);font-weight:700;padding:8px 10px;font-size:12.5px;z-index:2}
.sheet thead th.now{background:var(--gold-soft);color:var(--ink)}
.sheet .rh{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;padding:6px 10px;font-weight:600;min-width:190px;max-width:230px;border-left:4px solid var(--c)}
.sheet thead .rh{z-index:3;background:var(--sunk);border-left-color:transparent}
.sheet .rh small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.sheet .rh .del{float:right;border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:0 2px;visibility:hidden}
.sheet tr:hover .rh .del{visibility:visible}
.sheet td input{width:76px;border:0;background:transparent;text-align:right;padding:7px 10px;outline:none}
.sheet td input:focus{background:var(--gold-soft);box-shadow:inset 0 0 0 2px var(--gold)}
.sheet tr.sec td,.sheet tr.sec th{background:var(--c-soft);font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--c);padding:6px 10px}
.sheet tr.tot td,.sheet tr.tot th{font-weight:800;padding:8px 10px;text-align:right;background:var(--sunk)}
.sheet tr.tot th{text-align:left}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700}
.btn.pri{background:var(--green);color:#fff;border-color:var(--green)}
.btn.gold{background:var(--gold-soft);border-color:var(--gold)}
.field{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--ink);min-width:0}
.formrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:12px;border-radius:12px;background:var(--sunk);margin-bottom:12px}
.formrow .field{flex:1 1 150px}

/* analysis */
.catbars{display:grid;gap:10px}
.cb{display:grid;grid-template-columns:minmax(110px,190px) 1fr 80px;gap:10px;align-items:center;font-size:13.5px}
.cb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cb .tr{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.cb .tr i{display:block;height:100%;background:var(--c);border-radius:6px}
.cb .v{text-align:right;font-weight:700}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-brand);font-weight:400;font-size:22px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13.5px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* phone dock */
nav.dock{display:none}
@media (max-width:760px){
  .hero{grid-template-columns:1fr 1fr}
  .kpi.main,.hero .kpi:last-child{grid-column:1/-1}
  .kpi .v{font-size:26px} .kpi.main .v{font-size:38px}
  .two{grid-template-columns:1fr}
  .ribbon{display:none}
  .sync span{display:none}
  .brand{font-size:19px}
  .doc-pill{display:none}
  nav.dock{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
  nav.dock button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--muted);border-radius:12px}
  nav.dock svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
  nav.dock button[aria-selected="true"]{color:var(--ink);background:var(--gold-soft)}
  .cb{grid-template-columns:110px 1fr 70px}
  .plist{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="logo" aria-hidden="true">1</div>
      <div class="brand">Office In<small> 1</small></div>
      <div class="doc-pill"><i>$</i><span>Budget<b style="color:var(--gold)">OS</b> · Comptes</span></div>
      <div class="spacer"></div>
      <div class="sync" id="sync"><b></b><span>Connexion…</span></div>
      <button class="iconbtn" id="themeBtn" aria-label="Changer le thème"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    </div>
    <div class="ribbon" role="tablist" id="ribbon">
      <button role="tab" data-v="home" aria-selected="true">Accueil</button>
      <button role="tab" data-v="periods" aria-selected="false">Paies</button>
      <button role="tab" data-v="sheet" aria-selected="false">Grille</button>
      <button role="tab" data-v="insights" aria-selected="false" class="gold">● Analyse</button>
      <button role="tab" data-v="settings" aria-selected="false">Réglages</button>
    </div>
  </div>
</header>

<main class="wrap" id="app">
  
</main>

<nav class="dock" id="dock" role="tablist">
  <button data-v="home" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-v="periods" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Paies</button>
  <button data-v="sheet" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></svg>Grille</button>
  <button data-v="insights" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Analyse</button>
  <button data-v="settings" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h0a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v0a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>Réglages</button>
</nav>
<div class="toast" id="toast"></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const app=$('#app');
const fmt=new Intl.NumberFormat('fr-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0});
const money=n=>fmt.format(Math.round(n||0));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GROUPS={revenu:{label:'Revenus',c:'var(--gold)',s:'var(--gold-soft)'},fixe:{label:'Dépenses fixes',c:'var(--blue)',s:'var(--blue-soft)'},variable:{label:'Dépenses variables',c:'var(--orange)',s:'var(--orange-soft)'}};
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12l5 5L19 7"/></svg>';
const CACHE='budget-martin-cache-v1';

let S=null, view='home', saveTimer=null, saving=false, dirty=false, lastSync=0;
const SYNC_KEY='budgetos-sync-v1';
let SYNC=(()=>{try{return JSON.parse(localStorage.getItem(SYNC_KEY))||{}}catch(e){return{}}})();
let remoteSha=null;
let openForm=null;

/* theme toggle */
try{const t=localStorage.getItem('bm-theme'); if(t) document.documentElement.setAttribute('data-theme',t);}catch(e){}
$('#themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',nx);
  try{localStorage.setItem('bm-theme',nx)}catch(e){}
  render();
};

function setSync(state,text){const el=$('#sync');el.className='sync '+state;el.querySelector('span').textContent=text;}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),1800);}

/* ---------- model ---------- */
const val=(c,p)=>+(S.cells[c+'|'+p]||0);
const cats=g=>S.categories.filter(c=>c.group===g);
function periodsSorted(){return [...S.periods].sort((a,b)=>a.date.localeCompare(b.date));}
function totals(pid){let inc=0,fix=0,vr=0;for(const c of S.categories){const v=val(c.id,pid);if(c.group==='revenu')inc+=v;else if(c.group==='fixe')fix+=v;else vr+=v;}return{inc,fix,vr,out:fix+vr,net:inc-fix-vr};}
function running(){let r=+S.startBalance||0;return periodsSorted().map(p=>{const t=totals(p.id);r+=t.net;return{...p,...t,bal:r};});}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function currentIdx(rows){const t=todayISO();let i=-1;rows.forEach((r,k)=>{if(r.date<=t)i=k;});return i;}

/* ---------- persistence ---------- */
function persistLocal(){try{localStorage.setItem(CACHE,JSON.stringify(S))}catch(e){}}
function scheduleSave(){
  S.updatedAt=Date.now(); persistLocal();
  if(!syncOn()){setSync('ok','Enregistré sur cet appareil');return;}
  dirty=true;setSync('busy','Enregistrement…');
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,900);
}
/* ---- synchro téléphone ↔ ordi : un fichier budget.json dans un dépôt GitHub PRIVÉ ---- */
const syncOn=()=>!!(SYNC.token&&SYNC.repo);
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,''))));
async function gh(method,body){
  const r=await fetch('https://api.github.com/repos/'+SYNC.repo+'/contents/budget.json'+(method==='GET'?'?t='+Date.now():''),{method,cache:'no-store',
    headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+SYNC.token,'X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined});
  if(r.status===404&&method==='GET')return null;
  if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e;}
  return r.json();
}
async function pull(){
  if(!syncOn())return;
  try{
    const f=await gh('GET'); lastSync=Date.now();
    if(!f){remoteSha=null; if(S){dirty=true;flush();} return;}
    remoteSha=f.sha; const remote=JSON.parse(b64d(f.content));
    if(!S||(remote.updatedAt||0)>(S.updatedAt||0)){
      if(document.activeElement&&document.activeElement.matches('input')&&S)return;
      S=remote;persistLocal();render();setSync('ok','Synchronisé');
    }else if((S.updatedAt||0)>(remote.updatedAt||0)){dirty=true;flush();}
    else setSync('ok','Synchronisé');
  }catch(e){setSync('err',e.status===401||e.status===403?'Jeton refusé — voir Réglages':e.status===404?'Dépôt introuvable — voir Réglages':'Hors ligne — gardé sur cet appareil');}
}
async function flush(){
  if(saving||!dirty||!syncOn())return; saving=true; dirty=false;
  try{
    const res=await gh('PUT',{message:'BudgetOS '+new Date().toISOString(),content:b64e(JSON.stringify(S,null,1)),sha:remoteSha||undefined});
    remoteSha=res.content.sha; lastSync=Date.now(); setSync('ok','Enregistré · synchronisé');
  }catch(e){
    if(e.status===409||e.status===422){ // l'autre appareil a écrit entre-temps : on relit, la version la plus récente gagne
      saving=false; await pull(); return; }
    dirty=true; setSync('err',e.status===401||e.status===403?'Jeton refusé — voir Réglages':'Hors ligne — sera envoyé plus tard');
  }
  saving=false; if(dirty&&navigator.onLine!==false)setTimeout(flush,5000);
}
function setCell(c,p,v){const k=c+'|'+p;const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));if(!n)delete S.cells[k];else S.cells[k]=Math.round(n*100)/100;scheduleSave();}

/* ---------- views ---------- */
function render(){
  document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===view));
  if(!S){app.innerHTML=view==='settings'?vSettings():vWelcome();return;}
  if(!S.periods.length&&view!=='sheet'&&view!=='settings'){app.innerHTML=vWelcome(true);return;}
  const rows=running();
  if(view==='home')app.innerHTML=vHome(rows);
  else if(view==='periods')app.innerHTML=vPeriods(rows);
  else if(view==='sheet')app.innerHTML=vSheet(rows);
  else if(view==='insights')app.innerHTML=vInsights(rows);
  else app.innerHTML=vSettings();
  if(view==='home')drawChart(rows);
}

function vHome(rows){

  const firstPos=(()=>{for(let i=rows.length-1;i>=0;i--){if(rows[i].bal<0)return rows[i+1]||null;}return rows[0];})();
  const focus=nxt||cur;
  const lines=S.categories.filter(c=>c.group!=='revenu'&&val(c.id,focus.id));
  const paidCount=lines.filter(c=>S.paid[c.id+'|'+focus.id]).length;

  <div class="hero">

      <div class="v ${cur.bal<0?'neg':''}">${money(cur.bal)}</div>
      <div class="d">${nxt?`Prochaine paie le <b>${esc(nxt.label)}</b> : +${money(nxt.inc)} · sorties ${money(nxt.out)}`:'Fin de l’horizon prévu'}</div></div>
    <div class="kpi"><div class="eyebrow">Point le plus bas</div><div class="v ${low.bal<0?'neg':''}">${money(low.bal)}</div><div class="d">le ${esc(low.label)}</div></div>
    <div class="kpi"><div class="eyebrow">Retour au positif</div><div class="v posc" style="font-size:26px">${firstPos?esc(firstPos.label):'—'}</div><div class="d">${firstPos?'pour de bon':'reste négatif'}</div></div>
    <div class="kpi"><div class="eyebrow">Solde au ${esc(last.label)}</div><div class="v ${last.bal<0?'neg':'posc'}">${money(last.bal)}</div><div class="d">${rows.length} paies prévues</div></div>
  </div>
  <div class="two">
    <div class="panel"><h2>Évolution du solde</h2><p class="sub">Solde cumulé après chaque paie, comme la ligne Totaux de ton tableau.</p>
      <div class="chartbox" id="chart"></div>
      <div class="legend"><span style="--c:var(--green)">Solde cumulé</span><span style="--c:var(--red)">Sous zéro</span><span style="--c:var(--gold)">Aujourd’hui</span></div></div>
    <div class="panel"><h2>À payer · ${esc(focus.label)}</h2><p class="sub">${paidCount}/${lines.length} cochés · touche pour marquer comme payé</p>
      <div class="items">${lines.map(c=>itemRow(c,focus.id)).join('')||'<p class="sub">Rien de prévu.</p>'}</div>
      <div class="sumrow"><span>Reste après la paie</span><span class="${focus.net<0?'neg':'posc'}">${focus.net>=0?'+':''}${money(focus.net)}</span></div></div>
  </div>
  <div class="panel"><h2>Ce qu’il faut savoir</h2><p class="sub">Calculé automatiquement à partir de ta grille.</p><div class="insights">${insights(rows).slice(0,3).map(insHTML).join('')}</div></div>
  </section>`;
}
function itemRow(c,pid){const k=c.id+'|'+pid;const done=!!S.paid[k];const g=GROUPS[c.group];
  return `<div class="item ${done?'done':''}"><button class="chk" data-paid="${k}" aria-pressed="${done}" aria-label="Payé : ${esc(c.name)}">${CHECK}</button>
  <div class="nm"><div><span class="dot" style="--c:${g.c}"></span>${esc(c.name)}</div>${c.note?`<small>${esc(c.note)}</small>`:''}</div><div class="amt">${money(val(c.id,pid))}</div></div>`;}

function drawChart(rows){
  const box=$('#chart'); if(!box)return;
  const W=Math.max(300,box.clientWidth), H=Math.round(Math.min(320,Math.max(190,W*0.45)));
  const pl=52,pr=12,pt=14,pb=28; const iw=W-pl-pr, ih=H-pt-pb;
  const vals=rows.map(r=>r.bal); let mn=Math.min(0,...vals), mx=Math.max(0,...vals);
  const step=niceStep((mx-mn)/4); mn=Math.floor(mn/step)*step; mx=Math.ceil(mx/step)*step;
  const x=i=>pl+(rows.length===1?iw/2:i*iw/(rows.length-1)); const y=v=>pt+(mx-v)/(mx-mn)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Solde cumulé par paie">`;
  for(let v=mn;v<=mx+0.1;v+=step){s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" ${v===0?'':'stroke-dasharray="2 4"'}/>`;
    s+=`<text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v===0?'0':(v/1000).toLocaleString('fr-CA')+' k'}</text>`;}
  const z=y(0); const pts=rows.map((r,i)=>[x(i),y(r.bal)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  s+=`<defs><clipPath id="above"><rect x="0" y="0" width="${W}" height="${z}"/></clipPath><clipPath id="below"><rect x="0" y="${z}" width="${W}" height="${H}"/></clipPath></defs>`;
  const area=path+` L${pts[pts.length-1][0]} ${z} L${pts[0][0]} ${z} Z`;
  s+=`<path d="${area}" fill="var(--green)" opacity=".14" clip-path="url(#above)"/><path d="${area}" fill="var(--red)" opacity=".16" clip-path="url(#below)"/>`;
  s+=`<path d="${path}" fill="none" stroke="var(--green)" stroke-width="2.4" clip-path="url(#above)" stroke-linejoin="round"/><path d="${path}" fill="none" stroke="var(--red)" stroke-width="2.4" clip-path="url(#below)" stroke-linejoin="round"/>`;
  const ci=currentIdx(rows); const every=Math.max(1,Math.ceil(rows.length*64/iw)); const lastI=rows.length-1;
  rows.forEach((r,i)=>{const now=i===ci;
    s+=`<circle cx="${x(i)}" cy="${y(r.bal)}" r="${now?5.5:3}" fill="${now?'var(--gold)':(r.bal<0?'var(--red)':'var(--green)')}" stroke="var(--surface)" stroke-width="1.5"><title>${r.label} : ${money(r.bal)}</title></circle>`;
    if((i%every===0&&lastI-i>=every)||i===lastI)s+=`<text x="${x(i)}" y="${H-8}" text-anchor="${i===0?'start':i===rows.length-1?'end':'middle'}" font-size="11" fill="var(--muted)">${esc(r.label)}</text>`;});
  const last=pts[pts.length-1]; s+=`<text x="${last[0]-8}" y="${last[1]-10}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">${money(rows[rows.length-1].bal)}</text>`;
  box.innerHTML=s+'</svg>';
}
function niceStep(r){if(r<=0)return 500;const p=Math.pow(10,Math.floor(Math.log10(r)));const f=r/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}

  <div class="plist">${rows.map((r,i)=>{
    const inc=r.inc||1; const fp=Math.min(100,r.fix/inc*100), vp=Math.min(100-fp,r.vr/inc*100);
    return `<article class="pcard ${i===ci?'now':''}"><div class="phead"><div><div class="date">${esc(r.label)}</div>${i===ci?'<span class="chip y">Paie en cours</span>':(r.net<0?'<span class="chip r">Déficit '+money(r.net)+'</span>':'<span class="chip g">+'+money(r.net)+'</span>')}</div>
      <div class="bal"><small>Solde cumulé</small><div class="${r.bal<0?'neg':'posc'}">${money(r.bal)}</div></div></div>
      <div style="padding-top:12px"><div class="bars" title="Part du revenu"><i style="width:${fp}%;background:var(--blue)"></i><i style="width:${vp}%;background:var(--orange)"></i></div></div>
      <div class="pbody">${['revenu','fixe','variable'].map(g=>{const list=cats(g).filter(c=>val(c.id,r.id));if(!list.length)return'';

          return `<div class="item ${done?'done':''}">${g==='revenu'?`<span></span>`:`<button class="chk" data-paid="${k}" aria-pressed="${done}" aria-label="Payé : ${esc(c.name)}">${CHECK}</button>`}
          <div class="nm"><div><span class="dot" style="--c:${GROUPS[g].c}"></span>${esc(c.name)}</div></div>

function vSheet(rows){
  const ci=currentIdx(rows);
  const head=`<tr><th class="rh">Date de dépôt</th>${rows.map((r,i)=>`<th class="${i===ci?'now':''}">${esc(r.label)}</th>`).join('')}</tr>`;
  let body='';
  for(const g of ['revenu','fixe','variable']){
    body+=`<tr class="sec" style="--c:${GROUPS[g].c};--c-soft:${GROUPS[g].s}"><th class="rh" style="--c:${GROUPS[g].c}">${GROUPS[g].label}</th><td colspan="${rows.length}"></td></tr>`;
    for(const c of cats(g)){
      body+=`<tr><th class="rh" style="--c:${GROUPS[g].c}"><button class="del" data-del="${c.id}" aria-label="Supprimer ${esc(c.name)}">×</button>${esc(c.name)}${c.note?`<small>${esc(c.note)}</small>`:''}</th>`+
        rows.map(r=>{const v=val(c.id,r.id);return `<td><input id="c-${c.id}-${r.id}" inputmode="decimal" data-cell="${c.id}|${r.id}" value="${v||''}" aria-label="${esc(c.name)} ${esc(r.label)}"></td>`;}).join('')+'</tr>';
    }
  }
  body+=`<tr class="tot"><th class="rh">Net de la paie</th>${rows.map(r=>`<td class="${r.net<0?'neg':'posc'}">${money(r.net)}</td>`).join('')}</tr>`;
  body+=`<tr class="tot"><th class="rh">Totaux (cumulé)</th>${rows.map(r=>`<td class="${r.bal<0?'neg':''}">${money(r.bal)}</td>`).join('')}</tr>`;
  const form=openForm==='cat'?`<form class="formrow" id="fCat"><label class="field">Nom de la ligne<input id="nCatName" required placeholder="Ex. Internet"></label>
      <label class="field">Groupe<select id="nCatGroup"><option value="fixe">Dépense fixe</option><option value="variable">Dépense variable</option><option value="revenu">Revenu</option></select></label>
      <label class="field">Note (facultatif)<input id="nCatNote" placeholder="Ex. le 5 du mois"></label><button class="btn pri" type="submit">Ajouter</button><button class="btn" type="button" data-close>Annuler</button></form>`
    :openForm==='per'?`<form class="formrow" id="fPer"><label class="field">Date de la paie<input id="nPerDate" type="date" required></label><button class="btn pri" type="submit">Ajouter la paie</button><button class="btn" type="button" data-close>Annuler</button></form>`
    :openForm&&openForm.startsWith('del:')?(()=>{const c=S.categories.find(x=>x.id===openForm.slice(4));return c?`<div class="formrow"><span style="flex:1;color:var(--ink)">Supprimer la ligne <b>${esc(c.name)}</b> et tous ses montants ?</span><button class="btn" style="background:var(--red);color:#fff;border-color:var(--red)" data-confirmdel="${c.id}">Supprimer</button><button class="btn" data-close>Annuler</button></div>`:''})():'';
  return `<section class="view"><div class="panel"><h2>Grille du budget</h2><p class="sub">Ton tableau Excel, éditable. Les totaux se recalculent à chaque saisie.</p>
    <div class="toolbar"><button class="btn gold" data-open="cat">+ Ligne</button><button class="btn gold" data-open="per">+ Paie</button>
      <label class="field" style="flex-direction:row;display:flex;align-items:center;gap:8px;margin-left:auto">Solde de départ <input id="startBal" inputmode="decimal" style="width:100px;text-align:right" value="${+S.startBalance||0}"></label></div>
    ${form}<div class="tablewrap"><table class="sheet"><thead>${head}</thead><tbody>${body}</tbody></table></div></div></section>`;
}

function insights(rows){
  const out=[]; const neg=rows.filter(r=>r.bal<0); const low=rows.reduce((m,r)=>r.bal<m.bal?r:m,rows[0]);
  if(neg.length){out.push({t:'r',i:'!',h:`${neg.length} paies sur ${rows.length} finissent sous zéro`,p:`Du ${neg[0].label} au ${neg[neg.length-1].label}. Le creux est de ${money(low.bal)} le ${low.label} : il faut ce montant en marge de crédit ou en coussin d’épargne pour passer.`});}
  // pattern gaps: a line paid on most 15s (or 30s) but missing on some future ones
  const ci=currentIdx(rows); const fut=rows.filter((r,i)=>i>ci);
  const gaps=[];
  for(const c of S.categories){ if(c.group==='revenu')continue;
    for(const kind of ['15','30']){const same=rows.filter(r=>kind==='15'?+r.date.slice(8)<=20:+r.date.slice(8)>20);if(same.length<4)continue;
      const have=same.filter(r=>val(c.id,r.id)).length; if(have/same.length<0.6||have===same.length)continue;
      const miss=fut.filter(r=>same.includes(r)&&!val(c.id,r.id)); if(miss.length)gaps.push({c,miss,typ:Math.round(same.filter(r=>val(c.id,r.id)).reduce((a,r)=>a+val(c.id,r.id),0)/have)});}}
  gaps.sort((a,b)=>b.typ*b.miss.length-a.typ*a.miss.length);
  for(const g of gaps.slice(0,3)){const impact=g.typ*g.miss.length;
    out.push({t:'y',i:'?',h:`${g.c.name} : rien de prévu le ${g.miss.map(r=>r.label).join(', ')}`,p:`D’habitude ${money(g.typ)} à cette date. Si c’est un oubli, ton solde final baisse de ${money(impact)} (${money(rows[rows.length-1].bal-impact)}).`});}
  const zero=S.categories.filter(c=>c.group!=='revenu'&&!rows.some(r=>val(c.id,r.id)));
  if(zero.length)out.push({t:'b',i:'0',h:`Aucun montant prévu : ${zero.map(c=>c.name).join(', ')}`,p:'Ces lignes sont vides sur toute la période. Une petite somme réservée à chaque paie évite les mauvaises surprises.'});
  const fix=rows.reduce((a,r)=>a+r.fix,0), inc=rows.reduce((a,r)=>a+r.inc,0), vr=rows.reduce((a,r)=>a+r.vr,0);
  if(inc)out.push({t:'g',i:'%',h:`Les dépenses fixes prennent ${Math.round(fix/inc*100)} % de tes revenus`,p:`Variables : ${Math.round(vr/inc*100)} %. Il reste en moyenne ${money((inc-fix-vr)/rows.length)} par paie.`});
  return out;
}
const insHTML=x=>`<div class="ins ${x.t}"><div class="ic">${x.i}</div><div><b>${esc(x.h)}</b><p>${esc(x.p)}</p></div></div>`;

function vInsights(rows){
  const tot={}; let max=0; for(const c of S.categories){if(c.group==='revenu')continue;const t=rows.reduce((a,r)=>a+val(c.id,r.id),0);if(t){tot[c.id]=t;max=Math.max(max,t);}}
  const list=S.categories.filter(c=>tot[c.id]).sort((a,b)=>tot[b.id]-tot[a.id]);
  const inc=rows.reduce((a,r)=>a+r.inc,0), out=rows.reduce((a,r)=>a+r.out,0);
  return `<section class="view"><div class="panel"><h2>Analyse</h2><p class="sub">Du ${esc(rows[0].label)} au ${esc(rows[rows.length-1].label)} · revenus ${money(inc)} · sorties ${money(out)}</p><div class="insights">${insights(rows).map(insHTML).join('')}</div></div>
  <div class="panel"><h2>Où va l’argent</h2><p class="sub">Total de chaque ligne sur toute la période.</p><div class="catbars">${list.map(c=>`<div class="cb"><div class="nm" title="${esc(c.name)}">${esc(c.name)}</div><div class="tr"><i style="width:${tot[c.id]/max*100}%;--c:${GROUPS[c.group].c}"></i></div><div class="v">${money(tot[c.id])}</div></div>`).join('')}</div>
  <div class="legend" style="margin-top:14px"><span style="--c:var(--blue)">Fixe</span><span style="--c:var(--orange)">Variable</span></div></div></section>`;
}

function newBudget(){
  const M=['janv.','fév.','mars','avril','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  const d=new Date(); const periods=[];
  for(let k=0;k<12;k++){const y=d.getFullYear()+Math.floor((d.getMonth()+k)/12), m=(d.getMonth()+k)%12;
    for(const day of [15,30]){const dd=m===1&&day===30?28:day;periods.push({id:'p'+y+String(m+1).padStart(2,'0')+dd,label:dd+' '+M[m],date:y+'-'+String(m+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0')});}}
  const C=[['sal','Salaire','revenu'],['aut','Autres revenus','revenu'],['loy','Loyer','fixe'],['epi','Épicerie','fixe'],['ess','Essence','fixe'],['hyd','Hydro','fixe'],['cel','Cellulaire','fixe'],['ass','Assurances','fixe'],['div','Divers','variable'],['epa','Épargne et placement','variable']];
  S={v:1,startBalance:0,periods,categories:C.map(([id,name,group])=>({id,name,group,note:''})),cells:{},paid:{}};
  view='sheet';scheduleSave();render();toast('Budget créé');
}
function importFile(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=()=>{try{const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.periods)||!Array.isArray(d.categories))throw 0;
      d.cells=d.cells||{};d.paid=d.paid||{};S=d;view='home';scheduleSave();render();toast('Budget importé');}
    catch(e){toast('Ce fichier n’est pas un budget BudgetOS');}};
  r.readAsText(f);
}
function exportFile(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='budget-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000); toast('Fichier exporté');
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-v]'); if(!t)return;
  if(t.dataset.v){view=t.dataset.v;openForm=null;render();scrollTo({top:0});return;}
  if(t.dataset.new!==undefined){newBudget();return;}
  if(t.dataset.unsync!==undefined){SYNC={};try{localStorage.removeItem(SYNC_KEY)}catch(e){}remoteSha=null;setSync('ok','Enregistré sur cet appareil');render();toast('Synchro déconnectée');return;}
  if(t.dataset.export!==undefined&&S){exportFile();return;}
  if(!S)return;
  if(t.dataset.paid){const k=t.dataset.paid;if(S.paid[k])delete S.paid[k];else S.paid[k]=true;scheduleSave();render();return;}
  if(t.dataset.edit){const k=t.dataset.edit;const[c,p]=k.split('|');const inp=document.createElement('input');inp.className='amtin';inp.inputMode='decimal';inp.value=val(c,p)||'';
    t.replaceWith(inp);inp.focus();inp.select();let done=false;const commit=()=>{if(done)return;done=true;setCell(c,p,inp.value);render();};
    inp.addEventListener('blur',commit);inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')inp.blur();if(ev.key==='Escape'){done=true;render();}});return;}
  if(t.dataset.open){openForm=t.dataset.open;render();const f=document.querySelector('.formrow input');f&&f.focus();return;}
  if(t.dataset.close!==undefined){openForm=null;render();return;}
  if(t.dataset.del){openForm='del:'+t.dataset.del;render();return;}
  if(t.dataset.confirmdel){const id=t.dataset.confirmdel;S.categories=S.categories.filter(c=>c.id!==id);for(const k of Object.keys(S.cells))if(k.startsWith(id+'|'))delete S.cells[k];for(const k of Object.keys(S.paid))if(k.startsWith(id+'|'))delete S.paid[k];openForm=null;scheduleSave();render();toast('Ligne supprimée');return;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='importFile'||t.id==='importFile2'){importFile(t);t.value='';return;}
  if(!S)return;
  if(t.dataset.cell){const[c,p]=t.dataset.cell.split('|');setCell(c,p,t.value);render();}
  if(t.id==='startBal'){S.startBalance=parseFloat(t.value.replace(',','.'))||0;scheduleSave();render();}
});
document.addEventListener('keydown',e=>{const t=e.target;if(t.dataset&&t.dataset.cell&&e.key==='Enter'){e.preventDefault();t.blur();}});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='fSync'){SYNC={repo:$('#syncRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,''),token:$('#syncToken').value.trim()};
    try{localStorage.setItem(SYNC_KEY,JSON.stringify(SYNC))}catch(err){}
    setSync('busy','Connexion…');pull().then(()=>{render();if(syncOn()&&lastSync)toast('Synchro connectée');});return;}
  if(!S)return;
  if(e.target.id==='fCat'){const name=$('#nCatName').value.trim();if(!name)return;
    S.categories.push({id:'c'+Date.now().toString(36),name,group:$('#nCatGroup').value,note:$('#nCatNote').value.trim()});openForm=null;scheduleSave();render();toast('Ligne ajoutée');}
  if(e.target.id==='fPer'){const d=$('#nPerDate').value;if(!d)return;const M=['janv.','fév.','mars','avril','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
    S.periods.push({id:'p'+Date.now().toString(36),label:(+d.slice(8))+' '+M[+d.slice(5,7)-1],date:d});openForm=null;scheduleSave();render();toast('Paie ajoutée');}
});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(view==='home'&&S)drawChart(running());},150);});

/* ---------- boot ---------- */
try{const c=localStorage.getItem(CACHE);if(c)S=JSON.parse(c);}catch(e){}
app.innerHTML=''; render();
if(syncOn()){setSync('busy','Synchronisation…');pull();}else setSync('ok',S?'Enregistré sur cet appareil':'Sur cet appareil');
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&syncOn())pull();});
addEventListener('online',()=>{if(syncOn()){dirty?flush():pull();}});
setInterval(()=>{if(!document.hidden&&syncOn()&&!saving&&!dirty)pull();},60000);
})();
</script>
</body>
</html>
